<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

    <!-- Google font Link -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    />

    <!-- Icon link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <!-- CSS Style Link -->
    <link rel="stylesheet" href="./style.css" />

    <title>Frontend Mentor | Huddle landing</title>
  </head>
  <body>
    <div class="huddle-landing">
      <main class="hero">
        <!-- Header section -->
        <header class="logo-container">
          <img src="./images/logo.svg" alt="Huddle logo" class="logo" />
        </header>
        <!-- Hero section-->
        <!-- left (image) Section-->
        <section class="hero-content">
          <section class="img-container">
            <img src="./images/illustration-mockups.svg" alt="hero illustration" class="hero-img" />
          </section>
          <!-- right (text) Section-->
          <article class="text-container">
            <h2 class="title">Build The Community Your Fans Will Love</h2>
            <p class="paragraph">
              Huddle re-imagines the way we build communities. You have a voice, but so does your
              audience. Create connections with your users as you engage in genuine discussion.
            </p>
            <a href="#" class="btn">Register</a>
          </article>
        </section>
        <!-- Socal-media link Section -->
        <section class="socal-container">
          <!-- facebook icon -->
          <div class="social"><i class="fa-brands fa-facebook-f"></i></div>
          <!-- Twitter icon -->
          <div class="social"><i class="fa-brands fa-twitter"></i></div>
          <!-- Instagram icon -->
          <div class="social"><i class="fa-brands fa-instagram"></i></div>
        </section>
      </main>
    </div>
  </body>
</html>
